name: Release

# Push a tag like v1.0.0 to build the app and publish a GitHub Release with
# downloadable APKs. The tag should match `version:` in pubspec.yaml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      # Signs with a persistent key from repository secrets so each release
      # can be installed over the previous one. Without the secrets the APKs
      # are signed with a throwaway debug key (and say so in the notes).
      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; signing with a debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-luminar}"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Collect artifacts
        run: |
          mkdir dist
          out=build/app/outputs/flutter-apk
          cp "$out/app-release.apk"             "dist/luminar-$TAG.apk"
          cp "$out/app-arm64-v8a-release.apk"   "dist/luminar-$TAG-arm64-v8a.apk"
          cp "$out/app-armeabi-v7a-release.apk" "dist/luminar-$TAG-armeabi-v7a.apk"
          cp "$out/app-x86_64-release.apk"      "dist/luminar-$TAG-x86_64.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          {
            echo "## Download"
            echo
            echo "- **luminar-$TAG.apk**: works on any Android phone (Android 7.0+). Pick this if unsure."
            echo "- **…-arm64-v8a.apk**: smaller download for almost all modern phones."
            echo "- **…-armeabi-v7a.apk** / **…-x86_64.apk**: older 32-bit phones / emulators."
            echo
            echo "Install by opening the APK on your phone and allowing installs from that source."
            echo "Checksums are in \`SHA256SUMS.txt\`."
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "> **Note:** signed with a temporary debug key. Uninstall any earlier version before installing."
            fi
            echo
            echo "iOS is not included: distributing an iPhone build requires an Apple Developer account."
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Luminar $TAG" --notes-file notes.md --verify-tag
          fi
