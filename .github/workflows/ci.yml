name: CI

# Runs once per change, after it lands on main: merge first, then fix
# whatever this finds in a follow-up.
on:
  push:
    branches: [main]
    # Docs and screenshots don't change the app.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

# A newer push supersedes an older run: the latest run tests everything that
# landed before it, so the older one is cancelled instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A hanging test fails the run instead of holding it for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Formats in place and prints the diff, so a failure shows the fix.
      - name: Check formatting
        run: dart format lib test tool && git diff --exit-code

      - name: Analyze
        if: ${{ !cancelled() }}
        run: flutter analyze

      - name: Run tests
        if: ${{ !cancelled() }}
        run: flutter test --timeout 2m

      # Regenerates the freezed code and prints any difference to commit.
      - name: Check generated code
        if: ${{ !cancelled() }}
        run: |
          git stash --include-untracked --quiet || true
          git checkout -- .
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.freezed.dart'

      # Renders the app against simulated bulbs, so the UI can be reviewed
      # without a local Flutter SDK. Download "screenshots" from the run page.
      - name: Render screenshots
        if: ${{ !cancelled() }}
        run: flutter test tool/screenshots/take_screenshots.dart

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: docs/screenshots/
          if-no-files-found: error
