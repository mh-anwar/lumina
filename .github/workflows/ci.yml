name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read # to list earlier CI runs for the reuse check

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # PRs are squash-merged, so a push to main usually has exactly the tree a
      # PR run already passed. If so, reuse that result and skip the checks.
      - name: Reuse a passed PR run
        id: reuse
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "Pushed tree: $tree"
          runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml \
            --event pull_request --status success --limit 20 \
            --json databaseId,headSha \
            --jq '.[] | "\(.databaseId) \(.headSha)"') || runs=''
          while read -r run sha; do
            [ -n "$sha" ] || continue
            git fetch --no-tags --depth=1 --quiet origin "$sha" 2>/dev/null || continue
            if [ "$(git rev-parse "$sha^{tree}")" = "$tree" ]; then
              echo "Reusing run $run (PR head $sha): same tree, checks skipped."
              echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
              echo 'reuse=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done <<< "$runs"
          echo 'No passed PR run with this tree; running all checks.'
          echo 'reuse=false' >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        run: flutter pub get

      # Formats in place and prints the diff, so a failure shows the fix.
      - name: Check formatting
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        run: dart format lib test tool && git diff --exit-code

      - name: Analyze
        if: ${{ !cancelled() && steps.reuse.outputs.reuse != 'true' }}
        run: flutter analyze

      - name: Run tests
        if: ${{ !cancelled() && steps.reuse.outputs.reuse != 'true' }}
        run: flutter test

      # Regenerates the freezed code and prints any difference to commit.
      - name: Check generated code
        if: ${{ !cancelled() && steps.reuse.outputs.reuse != 'true' }}
        run: |
          git stash --include-untracked --quiet || true
          git checkout -- .
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.freezed.dart'

      # Renders the app against simulated bulbs, so a PR's UI can be reviewed
      # without a local Flutter SDK. Download "screenshots" from the run page.
      - name: Render screenshots
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.reuse.outputs.reuse != 'true' }}
        run: flutter test tool/screenshots/take_screenshots.dart

      - name: Upload screenshots
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.reuse.outputs.reuse != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: docs/screenshots/
          if-no-files-found: error
